name: ShamCashWeb
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ShamCashWeb:
    type: application
    platform: iOS
    sources:
      - ShamCashWeb
    info:
      path: ShamCashWeb/Info.plist
      properties:
        CFBundleDisplayName: ShamCash Web
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: يستخدم الموقع الكاميرا لمسح رمز QR والتقاط صور التحقق.
        NSPhotoLibraryUsageDescription: يحتاج الموقع الوصول للصور لرفع مستندات التحقق من الحساب.
        NSMicrophoneUsageDescription: قد يستخدم الموقع الميكروفون لمكالمات الدعم.
        ITSAppUsesNonExemptEncryption: false
